[project]
name = "calendar-invite"
version = "0.1.0"
description = "Extracts meeting actions and deadlines from DOCX and generates calendar invites"
requires-python = ">=3.9"

dependencies = [
    "python-docx",
    "dateparser",
    "icalendar",
    "holidays>=0.83",
    "spacy>=3.8.11",
    "click>=8.1.8",
]

[project.scripts]
calendar-invite = "calendar_invite.cli:main"

[tool.uv]
package = true
