[project]
name = "calendar-invite"
version = "0.1.0"
description = "Extracts meeting actions and deadlines from Teams notes and generates calendar invites"
requires-python = ">=3.9"
dependencies = [
    "python-docx",
    "spacy",
    "icalendar",
    "holidays>=0.83"
]

[project.scripts]
calendar-invite = "calendar_invite.cli:main"

[tool.uv]
package = true
